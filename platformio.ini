[env:esp32dev]
platform = espressif32 @ 6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = huge_app.csv

lib_deps =
    t-vk/ESP32 BLE Keyboard @ ^0.3.2
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/bodmer/TFT_Touch.git

build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1          ; was ILI9341
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_INVERSION_OFF=1      ; ST7789 default is ON; this panel needs OFF
  -D TFT_BL=21               ; <-- the real backlight pin (you had 27)
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=80000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1